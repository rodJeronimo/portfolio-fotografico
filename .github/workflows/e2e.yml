name: E2E

on:
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright e2e (contra preview)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # wait-for-vercel-preview depende do GitHub App da Vercel postar um
      # Deployment status (actor vercel[bot]) — não acontece aqui porque o
      # token Team-scoped usa `vercel deploy` via CLI (ver preview.yml), que
      # não passa pela integração GitHub App. Por isso fazemos nosso próprio
      # deploy de preview aqui, igual ao preview.yml, e testamos contra ele.
      - name: Deploy to Vercel (preview)
        id: deploy
        run: |
          url=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --yes)
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Run Playwright tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.url }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

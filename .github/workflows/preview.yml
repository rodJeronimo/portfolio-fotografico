name: Preview Deploy

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy preview (Vercel)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    # Requer secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
    # (configurados por @devops na Vercel — ver TASK-0003 / docs/architecture/folder-structure.md).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Deploy remoto (build acontece na Vercel, nao no runner do GitHub).
      # `vercel pull`/`vercel build --prebuilt` exigem uma permissao de
      # token que tokens escopados a Team nao tem neste projeto ("Could
      # not retrieve Project Settings") — `vercel deploy` simples funciona
      # com o mesmo token e e a abordagem usada aqui.
      - name: Deploy to Vercel (preview)
        id: deploy
        run: |
          url=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --yes)
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🔗 Preview deployado: ${{ steps.deploy.outputs.url }}`,
            });
